<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9e2d6">
<title>でんどうドリルで ほんだなづくり</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #e9e2d6;
  overscroll-behavior: none;
}
body {
  position: fixed;
  inset: 0;
  top: 0; right: 0; bottom: 0; left: 0;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  background: radial-gradient(ellipse at 50% 40%, #f1ebe1 0%, #e9e2d6 55%, #ddd3c4 100%);
}
#c {
  position: fixed;
  inset: 0;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  display: block;
  outline: none;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#fallback {
  position: fixed;
  inset: 0;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#fallback[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="fallback" hidden alt="">
